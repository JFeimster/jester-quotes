name: One-time YouTube playlist metadata snapshot
on:
  push:
    branches: [feat/videos-playlist-first-30]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract first 30 entries without downloading media
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q yt-dlp
          yt-dlp --version
          yt-dlp --flat-playlist --playlist-items 1:30 --dump-single-json --no-warnings --ignore-errors 'https://www.youtube.com/playlist?list=PLNVTCBFgR1Te-oB0QHlw_kUbfWQ46t_Pq' > /tmp/playlist.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/playlist.json'))
          items=data.get('entries') or []
          print('PLAYLIST_SNAPSHOT_BEGIN')
          print(json.dumps({'playlist_id':data.get('id'), 'playlist_title':data.get('title'),'channel':data.get('uploader'), 'entries':[
            {'position':n,'video_id':v.get('id'),'title':v.get('title'),'channel_title':v.get('channel') or v.get('uploader'),'description':v.get('description'),'duration':v.get('duration'), 'url':v.get('url'),'availability':v.get('availability')} for n,v in enumerate(items,1) if v]},ensure_ascii=False))
          print('PLAYLIST_SNAPSHOT_END')
          if len(items)<30: raise SystemExit(f'Only {len(items)} entries recovered; not safe to publish as 30')
          PY

      - name: Inspect publisher descriptions where accessible
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, concurrent.futures
          entries=[v for v in (json.load(open('/tmp/playlist.json')).get('entries') or []) if v and v.get('title') and v.get('id')]
          def detail(item):
            vid=item['id']
            try:
              p=subprocess.run(['yt-dlp','--no-playlist','--skip-download','--dump-single-json','--no-warnings','https://www.youtube.com/watch?v='+vid],capture_output=True,text=True,timeout=24)
              if p.returncode!=0:
                return {'id':vid,'description':None,'error':p.stderr.strip()[-240:]}
              value=json.loads(p.stdout)
              return {'id':vid,'title':value.get('title'),'channel':value.get('channel') or value.get('uploader'),'description':(value.get('description') or '')[:1800], 'duration':value.get('duration')}
            except Exception as e:
              return {'id':vid,'description':None,'error':str(e)[:180]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool: results=list(pool.map(detail,entries))
          print('PLAYLIST_DETAILS_BEGIN')
          print(json.dumps(results,ensure_ascii=False))
          print('PLAYLIST_DETAILS_END')
          PY
