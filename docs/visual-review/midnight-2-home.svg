<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" aria-labelledby="title desc" role="img" viewBox="0 0 1440 940"><title id="title">Midnight Carnival 2.0 — desktop composition preview</title><desc id="desc">Illustrative layout reference, not a screenshot of the built Astro branch. Shows black background, large editorial headline, jester portrait, split navigation cards and ivory featured quote.</desc><defs><linearGradient id="portrait" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#67273e"/><stop offset=".5" stop-color="#281d2d"/><stop offset="1" stop-color="#12121a"/></linearGradient><linearGradient id="coat" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#5b2940"/><stop offset="1" stop-color="#171923"/></linearGradient></defs><rect width="1440" height="940" fill="#101115"/><rect width="1440" height="82" x="0" y="0" fill="#141418" stroke="#6c5e51" stroke-width="1"/><rect width="40" height="40" x="53" y="19" fill="#382638" stroke="#d8ac64"/><text x="73" y="45" fill="#d8ac64" font-family="Georgia" font-size="27" text-anchor="middle">✦</text><text x="109" y="40" fill="#f5ebdd" font-family="Arial" font-size="27" font-weight="bold" letter-spacing="5">JESTER<tspan fill="#f26778">.</tspan></text><text x="109" y="59" fill="#b8a9b9" font-family="Arial" font-size="10" letter-spacing="2">QUOTES / THE CARNIVAL</text><g fill="#e5dbd0" font-family="Arial" font-size="14" font-weight="bold" letter-spacing="1.8"><text x="570" y="47">EXPLORE</text><text x="685" y="47">COLLECTIONS</text><text x="845" y="47">FAVORITES</text><text x="987" y="47">THE ARCHETYPE</text></g><rect width="239" height="44" x="1150" y="19" fill="#f26778"/><text x="1269" y="46" fill="#141115" font-family="Arial" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle">OPEN QUOTE STUDIO ↗</text><rect width="32" height="32" x="53" y="134" fill="none" stroke="#d8ac64"/><text x="69" y="159" fill="#f26778" font-family="Georgia" font-size="24" text-anchor="middle">✦</text><text x="101" y="155" fill="#d8ac64" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="3">THE MIDNIGHT CARNIVAL / VOLUME 001</text><text x="51" y="270" fill="#f5ebdd" font-family="Georgia" font-size="108">Long live</text><text x="51" y="383" fill="#d8ac64" font-family="Georgia" font-size="114" font-style="italic">the fool<tspan fill="#f26778">.</tspan></text><text x="53" y="448" fill="#e3d9d5" font-family="Arial" font-size="24">A hundred voices. Six curious collections.</text><text x="53" y="480" fill="#e3d9d5" font-family="Arial" font-size="24">Sometimes the joker is the only one telling the truth.</text><rect width="258" height="55" x="53" y="531" fill="#d8ac64"/><text x="182" y="565" fill="#141115" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">EXPLORE 100 QUOTES ↗</text><rect width="210" height="55" x="322" y="531" fill="none" stroke="#d8ac64" stroke-width="2"/><text x="427" y="565" fill="#f5ebdd" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">SURPRISE ME ✳</text><rect width="333" height="112" x="53" y="636" fill="#242127" stroke="#64544d"/><text x="74" y="672" fill="#d8ac64" font-family="Arial" font-size="12" font-weight="bold" letter-spacing="2">01 / DISCOVER</text><text x="74" y="712" fill="#f5ebdd" font-family="Georgia" font-size="23">Six sides of mischief ↗</text><rect width="341" height="112" x="390" y="636" fill="#242127" stroke="#64544d"/><text x="412" y="672" fill="#d8ac64" font-family="Arial" font-size="12" font-weight="bold" letter-spacing="2">02 / CREATE</text><text x="412" y="712" fill="#f5ebdd" font-family="Georgia" font-size="23">Make a quote your own ↗</text><rect width="552" height="612" x="807" y="134" fill="none" stroke="#d8ac64" opacity=".7"/><rect width="552" height="612" x="792" y="121" fill="url(#portrait)" stroke="#d8ac64" stroke-width="2"/><circle cx="1072" cy="429" r="207" fill="none" stroke="#d8ac64" stroke-opacity=".22" stroke-width="2"/><path fill="#69263f" stroke="#d8ac64"