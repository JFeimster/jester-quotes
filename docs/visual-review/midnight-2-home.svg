ily="Georgia" font-size="40">“There is a crack in everything...”</text><rect width="1440" height="940" x="0" y="0" fill="none" stroke="#101115"/><text x="1415" y="932" fill="#917b70" font-family="Arial" font-size="10" text-anchor="end">ILLUSTRATIVE COMPOSITION — NOT A BROWSER SCREENSHOT</text></svg>