<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 390 900"><title id="title">Midnight Carnival 2.0 — mobile layout composition</title><desc id="desc">Illustrative composition of responsive header and hero. Not a screenshot from the Astro build.</desc><defs><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#652b44"/><stop offset="1" stop-color="#17151e"/></linearGradient></defs><rect width="390" height="900" fill="#101115"/><rect width="390" height="122" x="0" y="0" fill="#141418" stroke="#63534d"/><rect width="38" height="38" x="17" y="16" fill="#312336" stroke="#d8ac64"/><text x="36" y="41" fill="#d8ac64" font-family="Georgia" font-size="25" text-anchor="middle">✦</text><text x="66" y="40" fill="#f5ebdd" font-family="Arial" font-size="24" font-weight="bold" letter-spacing="3">JESTER<tspan fill="#f26778">.</tspan></text><text x="66" y="54" fill="#b8a9b9" font-family="Arial" font-size="8" letter-spacing="2">QUOTES / THE CARNIVAL</text><g fill="#f5ebdd" font-family="Arial" font-size="11" font-weight="bold" letter-spacing="1"><text x="17" y="83">EXPLORE</text><text x="100" y="83">COLLECTIONS</text><text x="220" y="83">FAVORITES</text><text x="308" y="83">ABOUT</text></g><rect width="356" height="23" x="17" y="93" fill="#f26778"/><text x="195" y="109" fill="#101115" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">OPEN QUOTE STUDIO ↗</text><text x="20" y="165" fill="#d8ac64" font-family="Arial" font-size="11" font-weight="bold" letter-spacing="1">✦ THE MIDNIGHT CARNIVAL / VOL. 001</text><text x="15" y="245" fill="#f5ebdd" font-family="Georgia" font-size="67">Long live</text><text x="15" y="315" fill="#d8ac64" font-family="Georgia" font-size="67" font-style="italic">the fool<tspan fill="#f26778">.</tspan></text><text x="19" y="352" fill="#d9cdc9" font-family="Arial" font-size="13">A hundred voices. Six curious collections.</text><text x="19" y="372" fill="#d9cdc9" font-family="Arial" font-size="13">Sometimes the joker tells the truth.</text><rect width="352" height="43" x="19" y="399" fill="#d8ac64"/><text x="195" y="426" fill="#151115" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">EXPLORE 100 QUOTES ↗</text><rect width="352" height="43" x="19" y="450" fill="none" stroke="#d8ac64"/><text x="195" y="477" fill="#f5ebdd" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">SURPRISE ME ✳</text><rect width="352" height="48" x="19" y="514" fill="#242127" stroke="#6c5e51"/><text x="32" y="532" fill="#d8ac64" font-family="Arial" font-size="9" font-weight="bold">01 / DISCOVER</text><text x="32" y="550" fill="#f5ebdd" font-family="Georgia" font-size="15">Six sides of mischief ↗</text><rect width="352" height="48" x="19" y="567" fill="#242127" stroke="#6c5e51"/><text x="32" y="585" fill="#d8ac64" font-family="Arial" font-size="9" font-weight="bold">02 / CREATE</text><text x="32" y="603" fill="#f5ebdd" font-family="Georgia" font-size="15">Make a quote your own ↗</text><rect width="332" height="227" x="29" y="647" fill="url(#panel)" stroke="#d8ac64" stroke-width="2"/><circle cx="195" cy="761" r="95" fill="none" stroke="#d8ac64" stroke-opacity=".3"/><path fill="#69263f" stroke="#d8ac64" stroke-width="3" d="M94 738Q133 698 117 665Q165 717 195 673Q231 714 271 671Q251 719 298 740L267 773H126Z"/><circle cx="117" cy="665" r="6" fill="#d8ac64"/><circle cx="195" cy="673" r="6" fill="#d8ac64"/><circle cx="271" cy="671" r="6" fill="#d8ac64"/><path fill="#e8d1bc" d="M144 749Q168 727 197 730Q240 734 248 760L230 824Q197 858 164 820Z"/><path fill="#261b2a" d="M144 749Q167 731 196 732V854Q167 836 159 813Z"/><path stroke="#6a3149" stroke-width="4" d="M164 775l15 0M210 774l17 0"/><text x="380" y="893" fill="#9f8b80" font-family="Arial" font-size="8" text-anchor="end">ILLUSTRATIVE COMPOSITION, NOT SCREENSHOT</text></svg>