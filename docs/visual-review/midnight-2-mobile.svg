<text x="15" y="315" fill="#d8ac64" font-family="Georgia" font-size="67" font-style="italic">the fool<tspan fill="#f26778">.</tspan></text>
<text x="19" y="352" fill="#d9cdc9" font-family="Arial" font-size="13">A hundred voices. Six curious collections.</text>
<text x="19" y="372" fill="#d9cdc9" font-family="Arial" font-size="13">Sometimes the joker tells the truth.</text>
