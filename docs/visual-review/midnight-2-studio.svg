<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1440 900"><title id="title">Midnight Carnival 2.0 — Quote Studio composition preview</title><desc id="desc">Illustrative design composition, not an actual browser screenshot. Tactile format and palette buttons, quote selector, prominent ivory live canvas preview.</desc><rect width="1440" height="900" fill="#101115"/><rect width="1440" height="80" fill="#151417" stroke="#665851"/><text x="70" y="48" fill="#f5ebdd" font-family="Georgia" font-size="30" font-weight="bold">JESTER<tspan fill="#f26778">.</tspan></text><text x="850" y="47" fill="#d8ac64" font-family="Arial" font-size="14" font-weight="bold" letter-spacing="2">EXPLORE COLLECTIONS FAVORITES ABOUT</text><rect width="18" height="18" x="74" y="117" fill="#f26778"/><text x="106" y="132" fill="#d8ac64" font-family="Arial" font-size="13" letter-spacing="3">MIDNIGHT CARNIVAL / CREATOR TOOLS</text><text x="70" y="213" fill="#f5ebdd" font-family="Georgia" font-size="75">Make mischief <tspan fill="#d8ac64" font-style="italic">look good.</tspan></text><text x="72" y="259" fill="#d9cbc5" font-family="Arial" font-size="19">One hundred quotations. Four palettes. Four shapes. Every word intact.</text><rect width="620" height="555" x="70" y="296" fill="#1d2023" stroke="#9c7861"/><rect width="620" height="6" x="70" y="296" fill="#f26778"/><text x="103" y="337" fill="#d8ac64" font-family="Arial" font-size="13" letter-spacing="2">01 / CREATIVE CONTROLS</text><text x="103" y="389" fill="#f5ebdd" font-family="Georgia" font-size="43">The design desk.</text><text x="103" y="423" fill="#d3bfb8" font-family="Arial" font-size="17">Pick your voice, your canvas, and your mood.</text><text x="103" y="459" fill="#d8ac64" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="2">SELECTED QUOTATION</text><rect width="553" height="44" x="103" y="471" fill="#111115" stroke="#77655f"/><text x="121" y="499" fill=